# Definicion autonoma del servicio: se incluye desde el docker-compose.yml de la plataforma.
# Rutas relativas a esta carpeta, para poder moverla a su propio repositorio sin cambios.
services:
  test-fastify-service:
    build:
      context: .
    container_name: app-test-fastify-service
    environment:
      SERVICE_NAME: test-fastify-service
      SERVICE_PORT: "8084"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
      RABBITMQ_QUEUE: test.events
    expose:
      - "8084"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=app-observability-net
      # Router 1: Rutas publicas (sin JWT, priority 100)
      - 'traefik.http.routers.app-test-fastify-public.rule=PathPrefix(`/api/node/public`)'
      - traefik.http.routers.app-test-fastify-public.entrypoints=web
      - traefik.http.routers.app-test-fastify-public.middlewares=app-ratelimit@docker,app-secure-headers@docker
      - traefik.http.routers.app-test-fastify-public.service=app-test-fastify
      - traefik.http.routers.app-test-fastify-public.priority=100
      # Router 2: Rutas protegidas (exigen JWT, priority 10)
      - 'traefik.http.routers.app-test-fastify.rule=PathPrefix(`/api/node`)'
      - traefik.http.routers.app-test-fastify.entrypoints=web
      - traefik.http.routers.app-test-fastify.middlewares=app-jwt-auth@file,app-ratelimit@docker,app-inflight@docker,app-secure-headers@docker
      - traefik.http.routers.app-test-fastify.service=app-test-fastify
      - traefik.http.routers.app-test-fastify.priority=10
      # Loadbalancer
      - traefik.http.services.app-test-fastify.loadbalancer.server.port=8084
    networks:
      - app-net

networks:
  app-net:
    name: app-observability-net
